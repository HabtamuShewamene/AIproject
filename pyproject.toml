[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-platform"
version = "0.1.0"
description = "Sentiment analysis API and model training pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
    "apify-client>=1.8,<4",
    "datasets>=3.1,<5",
    "deep-translator>=1.11,<2",
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.36,<1",
    "langdetect==1.0.9",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "torch>=2.6,<3",
    "transformers>=4.46,<5",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<10",
    "watchdog>=6,<7",
]
research = [
    "jupyter>=1,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -o cache_dir=.pytest_cache_local"
